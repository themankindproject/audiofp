[package]
name         = "audiofp"
version      = "0.4.0"
edition      = "2024"
rust-version = "1.93.0"
license      = "MIT"
description  = "Pure-Rust audio fingerprinting: Wang, Panako, Haitsma–Kalker with streaming, in-memory matching, ONNX neural/watermark, no_std + alloc, Pod hash types."
repository   = "https://github.com/themankindproject/audiofp"
homepage     = "https://github.com/themankindproject/audiofp"
documentation = "https://docs.rs/audiofp"
authors      = ["bravo1goingdark <kumarashutosh34169@gmail.com>"]
keywords     = ["audio", "fingerprint", "no-std", "shazam", "acoustid"]
categories   = ["multimedia::audio", "algorithms"]
readme       = "README.md"
exclude      = [
    # Dev-only: CI, tooling, and repo metadata not needed by downstream.
    ".github/",
    ".claude/",
    ".agents/",

    # Test audio corpus (~8 MB) and golden snapshots.
    "tests/assets/",
    "tests/goldens/",

    # Integration / property / E2E test sources (unit tests are in src/).
    "tests/",

    # Fuzz harnesses.
    "fuzz/",

    # Benchmarks (users run their own; bench code references test helpers).
    "benches/",

    # Dev config files — not needed to compile the library.
    "clippy.toml",
    "deny.toml",
    "rustfmt.toml",
    "rust-toolchain.toml",

    # Contributor / governance docs.
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "CHANGELOG.md",
    "context.md",

    # Personal scratch files.
    "prep.md",
    "dsp.md",

    # Long-form docs — available on GitHub, not needed to compile.
    "USAGE.md",
    "ROBUSTNESS.md",
    "scripts/",

    # Examples — available on GitHub; not needed for library usage.
    "examples/",
]

[features]
default = []

# Symphonia-backed file decoding helpers (`audiofp::io`). `std` by itself
# enables no codecs; pick the per-codec sub-features your application needs
# (e.g. `features = ["std-wav"]` for WAV-only decoding). This keeps the
# default build no_std + alloc and avoids paying the compile time for codecs
# you never use. Without at least one codec feature, `audiofp::io` is not
# available (see the `compile_error!` in `src/lib.rs`).
std = ["dep:symphonia", "dep:ahash"]
std-mp3 = ["std", "symphonia/mp3"]
std-aac = ["std", "symphonia/aac"]
std-flac = ["std", "symphonia/flac"]
std-ogg = ["std", "symphonia/ogg", "symphonia/vorbis"]
std-wav = ["std", "symphonia/wav", "symphonia/pcm"]
std-mp4 = ["std", "symphonia/isomp4"]
# Extra codecs beyond the common set — kept for compatibility with the
# pre-0.4.0 monolithic `std` feature (AIFF, Matroska, ADPCM, ALAC).
std-aiff = ["std", "symphonia/aiff"]
std-mkv = ["std", "symphonia/mkv"]
std-adpcm = ["std", "symphonia/adpcm"]
std-alac = ["std", "symphonia/alac"]

# Every format/codec feature in one flag — the equivalent of the
# pre-0.4.0 monolithic `std` feature.
all = [
    "std-mp3",
    "std-aac",
    "std-flac",
    "std-ogg",
    "std-wav",
    "std-mp4",
    "std-aiff",
    "std-mkv",
    "std-adpcm",
    "std-alac",
]

# ONNX-based neural fingerprinter. The user supplies an ONNX model whose
# input is a `[1, n_mels, n_frames]` log-mel spectrogram and whose first
# output is a `[1, embedding_dim]` (or `[1, 1, embedding_dim]`) embedding.
# Requires std (we read the model file and feed PCM at runtime).
neural = ["std", "dep:tract-onnx"]

# AudioSeal-compatible watermark detector. Requires std.
watermark = ["std", "dep:tract-onnx"]

# Multi-threaded batch fingerprinting via rayon. Requires std.
rayon = ["std", "dep:rayon"]

# Install mimalloc as the process-wide #[global_allocator]. Requires std.
# Off by default because libraries should not pick the allocator on behalf of
# downstream binaries; flip this into `default` if you want it always-on.
mimalloc = ["std", "dep:mimalloc"]

[dependencies]
thiserror   = { version = "2.0.18", default-features = false }
mimalloc    = { version = "0.1.50", default-features = false, optional = true }
libm        = "0.2.16"
num-traits  = { version = "0.2.19", default-features = false }
num-complex = { version = "0.4.6", default-features = false }
realfft     = { version = "3.5.0", default-features = false }
wide        = { version = "1.6.0", default-features = false }
bytemuck    = { version = "1.25.0", features = ["derive"] }
ahash       = { version = "0.8.11", default-features = false, features = ["compile-time-rng"], optional = true }
symphonia   = { version = "0.6", default-features = false, optional = true }
rayon       = { version = "1.10", optional = true }
tract-onnx  = { version = "0.23", default-features = false, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
approx    = "0.5.1"
hound     = "3.5.1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest  = { version = "1.11", default-features = false, features = ["std"] }

[[bench]]
name    = "extract"
harness = false

[[bench]]
name              = "neural_frontend"
harness           = false
required-features = ["neural"]

[[bench]]
name    = "streaming"
harness = false

[[bench]]
name    = "matching"
harness = false

[lib]
name = "audiofp"
path = "src/lib.rs"

# Examples that use the symphonia-backed `audiofp::io` decoder require the
# relevant per-codec `std-*` features. Cargo silently skips them when their
# required features aren't enabled, so `cargo clippy --no-default-features
# --all-targets` stays clean.
[[example]]
name = "enroll_file"
required-features = ["std-mp3", "std-flac", "std-ogg", "std-wav", "std-mp4"]

[[example]]
name = "match_two_files"
required-features = ["std-mp3", "std-flac", "std-ogg", "std-wav", "std-mp4"]

[[example]]
name = "compare_algorithms"
required-features = ["std-mp3", "std-flac", "std-ogg", "std-wav", "std-mp4"]

[[example]]
name = "stream_buffer"

[[example]]
name = "dsp_starter"

[[example]]
name = "neural_embed"
required-features = ["neural"]

[[example]]
name = "watermark_detect"
required-features = ["watermark", "std-wav"]

[profile.release]
lto           = "fat"
codegen-units = 1
strip         = "symbols"

[profile.bench]
lto           = "fat"
codegen-units = 1

[workspace]
members = ["fuzz"]
