name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Jobs run in parallel unless they have explicit dependencies.
jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: clippy (per-codec features)
        run: cargo clippy --all-targets --features std-wav,std-mp3,std-flac,std-ogg -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: unit and integration tests
        run: cargo test --all-features -- --skip golden
      - name: doc tests
        run: cargo test --doc --all-features
      - name: doc build
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # USAGE.md snippet validity is OS-independent; run the checker once on
  # Linux rather than on the 3-OS matrix (Windows runners don't expose
  # a reliable `python3`).
  usage-snippets:
    name: doc snippet check (USAGE/README)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: compile + run rust snippets
        run: python3 scripts/check_usage_snippets.py
      - name: checker regression tests
        run: |
          python3 scripts/test_check_usage_snippets.py
          python3 scripts/test_shell_scripts.py
          python3 scripts/test_fuzz_smoke_all11.py

  allocation-tests:
    name: allocation regressions (std, no mimalloc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: zero-alloc streaming + index allocation tests
        run: cargo test --features std --test zero_alloc --test index_alloc

  doc-minimal:
    name: rustdoc (no default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc --no-default-features
        run: cargo doc --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings

  doc-std:
    name: rustdoc (bare std)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc --features std
        run: cargo doc --no-deps --features std
        env:
          RUSTDOCFLAGS: -D warnings

  golden:
    name: golden hash drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: regression (bit-exact hash output)
        run: cargo test --test regression --all-features

  matching-real-audio:
    name: matching (real audio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: cross-codec matching + index identification (Wang/Haitsma/Panako)
        run: cargo test --test matching_real_audio --features std-wav,std-mp3,std-flac,std-ogg

  coverage:
    name: code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: generate coverage (lcov)
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info -- --skip golden
      - name: upload to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-audit
        run: cargo install cargo-audit@0.22.1 --locked
      - name: cargo audit
        run: cargo audit

  property-tests:
    name: property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: property-based tests (256 cases)
        run: cargo test --test property --all-features
        env:
          PROPTEST_CASES: 256

  msrv:
    name: MSRV (1.93.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: check (all features, MSRV)
        run: cargo check --all-features
      - name: test (MSRV)
        run: cargo test --all-features

  no-std:
    name: no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: check no_std (default target)
        run: cargo check --no-default-features

  no-std-test:
    name: test no_std (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (no default features)
        run: cargo test --no-default-features

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features

  bakeoff:
    name: bakeoff unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: detect bakeoff-related changes
        id: changes
        run: |
          PATTERN='^(bakeoff/|benches/(watermark_plans|streaming)\.rs|BENCHMARKS\.md|\.github/workflows/(bakeoff|ci)\.yml)'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            if git diff --name-only "$BASE" "$HEAD" | grep -qE "$PATTERN"; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@1.93.0
        if: steps.changes.outputs.run == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.run == 'true'
        with:
          workspaces: bakeoff
      - name: install libchromaprint
        if: steps.changes.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y libchromaprint-dev
      - name: cargo fmt --check
        if: steps.changes.outputs.run == 'true'
        working-directory: bakeoff
        run: cargo fmt -- --check
      - name: clippy
        if: steps.changes.outputs.run == 'true'
        working-directory: bakeoff
        run: cargo clippy --all-targets -- -D warnings
      - name: unit tests
        if: steps.changes.outputs.run == 'true'
        working-directory: bakeoff
        run: cargo test

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-fuzz
        run: cargo +nightly install cargo-fuzz
      - name: fuzz smoke test (all 11 targets, bounded runs)
        run: bash scripts/fuzz_smoke_all11.sh
