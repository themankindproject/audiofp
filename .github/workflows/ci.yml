name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Jobs run in parallel unless they have explicit dependencies.
jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: clippy (per-codec features)
        run: cargo clippy --all-targets --features std-wav,std-mp3,std-flac,std-ogg -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: unit and integration tests
        run: cargo test --all-features -- --skip golden
      - name: doc tests
        run: cargo test --doc --all-features
      - name: doc build
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  golden:
    name: golden hash drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: regression (bit-exact hash output)
        run: cargo test --test regression --all-features

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-audit
        run: cargo install cargo-audit@0.22.1 --locked
      - name: cargo audit
        run: cargo audit

  property-tests:
    name: property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: property-based tests (256 cases)
        run: cargo test --test property --all-features
        env:
          PROPTEST_CASES: 256

  msrv:
    name: MSRV (1.93.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: check (all features, MSRV)
        run: cargo check --all-features
      - name: test (MSRV)
        run: cargo test --all-features

  no-std:
    name: no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: check no_std (default target)
        run: cargo check --no-default-features

  no-std-test:
    name: test no_std (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (no default features)
        run: cargo test --no-default-features

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-fuzz
        run: cargo +nightly install cargo-fuzz
      - name: fuzz smoke test (all 9 targets, 30s each)
        run: |
          for target in streaming_wang_equiv streaming_panako_equiv streaming_haitsma_equiv wang_hash_roundtrip panako_hash_roundtrip haitsma_hash_roundtrip sinc_resampler decode_bytes decode_resample; do
            echo "=== Fuzzing $target ==="
            cargo +nightly fuzz run --sanitizer=none "$target" -- -max_total_time=30 -runs=1000
          done
