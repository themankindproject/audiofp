[graph]
all-features = true

[advisories]
version = 2
yanked  = "deny"
ignore  = [
    # wide 1.6.0 is yanked but 1.6.1 and 1.5.0 are broken with safe_arch
    # 1.1.0 (missing AVX-512 intrinsics on CI runners). Pin the yanked
    # 1.6.0 until upstream publishes a compatible release.
    { crate = "wide@1.6.0", reason = "1.6.1 broken with safe_arch 1.1.0 (missing AVX-512 fns)" },
]

[licenses]
version  = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
]

# MPL-2.0 is the only weak-copyleft permitted; symphonia is the justification.
exceptions = [
    { allow = ["MPL-2.0"], crate = "symphonia" },
]

[bans]
multiple-versions = "warn"
wildcards         = "deny"
deny = [
    # Crates with known problematic licenses or security issues.
    { name = "openssl", reason = "prefer rustls-based alternatives" },
    { name = "native-tls", reason = "pulls openssl transitively; prefer rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
github = ["themankindproject"]
