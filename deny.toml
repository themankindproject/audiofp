[graph]
all-features = true

[advisories]
version = 2
yanked  = "deny"
ignore  = [
    # wide 1.6.1 is broken with safe_arch 1.1.0 (missing AVX-512
    # intrinsics) but fine with safe_arch >= 1.2.0. wide declares
    # `safe_arch = "^1.0.0"`, so a lockfile can land on the broken
    # combo — keep Cargo.lock on safe_arch >= 1.2.0 (CI builds from
    # the committed lockfile; fresh resolves pick 1.2.0 automatically).
]

[licenses]
version  = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
]

# MPL-2.0 (weak copyleft) is allowed only for the crates below, not
# globally: the Symphonia family (the `std-*` decoders) and `dyn-eq` (pulled
# in by tract for `neural` / `watermark`). A new MPL dependency fails
# `cargo deny check` until it is listed here on purpose.
exceptions = [
    { allow = ["MPL-2.0"], crate = "symphonia" },
    { allow = ["MPL-2.0"], crate = "symphonia-bundle-flac" },
    { allow = ["MPL-2.0"], crate = "symphonia-bundle-mp3" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-aac" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-adpcm" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-alac" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-pcm" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-vorbis" },
    { allow = ["MPL-2.0"], crate = "symphonia-common" },
    { allow = ["MPL-2.0"], crate = "symphonia-core" },
    { allow = ["MPL-2.0"], crate = "symphonia-format-isomp4" },
    { allow = ["MPL-2.0"], crate = "symphonia-format-mkv" },
    { allow = ["MPL-2.0"], crate = "symphonia-format-ogg" },
    { allow = ["MPL-2.0"], crate = "symphonia-format-riff" },
    { allow = ["MPL-2.0"], crate = "symphonia-metadata" },
    { allow = ["MPL-2.0"], crate = "dyn-eq" },
]

[bans]
multiple-versions = "warn"
wildcards         = "deny"
deny = [
    # Crates with known problematic licenses or security issues.
    { name = "openssl", reason = "prefer rustls-based alternatives" },
    { name = "native-tls", reason = "pulls openssl transitively; prefer rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
github = ["themankindproject"]
